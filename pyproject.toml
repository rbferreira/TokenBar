[project]
name = "tokenbar"
version = "1.0.0"
description = "Windows taskbar widget for real-time Claude Code token usage monitoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Rafael Ferreira", email = "rferreira.suporte@gmail.com" },
]
keywords = ["claude", "claude-code", "token", "taskbar", "widget", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/rbferreira/TokenBar"
Repository = "https://github.com/rbferreira/TokenBar"
Issues = "https://github.com/rbferreira/TokenBar/issues"

[project.optional-dependencies]
build = ["pyinstaller"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
